x-api-environment: &api-environment
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS}
  ENVIRONMENT: production
  RUN_MIGRATIONS: "false"
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
  RATE_LIMIT_SIGNUP_PER_HOUR: ${RATE_LIMIT_SIGNUP_PER_HOUR:-3}
  BIST_TLREF_RATE_DAILY_URL: https://www.borsaistanbul.com/datum/tlreforani.csv
  BIST_TLREF_INDEX_DAILY_URL: https://www.borsaistanbul.com/datum/bisttlrefendeksi.csv
  BIST_TLREF_HISTORICAL_URL: https://borsaistanbul.com/datum/BISTTLREFENDEKSI_D.zip
  BIST_TLREF_RATE_HISTORICAL_URL: https://www.borsaistanbul.com/datum/TLREFORANI_D.zip
  BIST_TLREFK_RATE_URL: https://www.borsaistanbul.com/datum/tlrefkorani.csv
  BIST_TLREFK_INDEX_URL: https://www.borsaistanbul.com/datum/bisttlrefkendeksi.csv
  BIST_TLREFK_RATE_HISTORICAL_URL: https://www.borsaistanbul.com/datum/TLREFKORANI_D.zip
  BIST_TLREFK_INDEX_HISTORICAL_URL: https://www.borsaistanbul.com/datum/BISTTLREFKENDEKSI_D.zip
  BIST_BOND_LIST_URL: https://borsaistanbul.com/datum/tbliste.zip
  BIST_RAW_ARCHIVE_DIR: /data/bist-source-files
  BIST_EXPECTED_READY_TIME: ${BIST_EXPECTED_READY_TIME:-16:05}
  BIST_HOLIDAYS: ${BIST_HOLIDAYS:-}
  BIST_BOOTSTRAP_ENABLED: ${BIST_BOOTSTRAP_ENABLED:-true}
  BIST_BOOTSTRAP_IF_EMPTY: ${BIST_BOOTSTRAP_IF_EMPTY:-true}
  BIST_BOOTSTRAP_REQUIRED_FOR_READINESS: ${BIST_BOOTSTRAP_REQUIRED_FOR_READINESS:-true}
  VALUATION_V2_READ_ENABLED: ${VALUATION_V2_READ_ENABLED:-true}
  VALUATION_V2_WRITE_ENABLED: ${VALUATION_V2_WRITE_ENABLED:-true}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  FRONTEND_URL: ${FRONTEND_URL}
  PROJECT_NAME: ${PROJECT_NAME:-Bondley API}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bondley.one}
  ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}

x-api-image: &api-image
  image: ghcr.io/mikailustuner/bondley-api:latest
  build:
    context: ./apps/api
    dockerfile: Dockerfile

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bondley-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *json-logging

  redis:
    image: redis:7-alpine
    container_name: bondley-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    logging: *json-logging

  bist-source-init:
    image: alpine:3.20
    container_name: bondley-bist-source-init
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - mkdir -p /data/bist-source-files && chown -R 1001:1001 /data/bist-source-files
    volumes:
      - bist_source_data:/data/bist-source-files
    logging: *json-logging

  migrate:
    <<: *api-image
    container_name: bondley-migrate
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *json-logging

  bootstrap:
    <<: *api-image
    container_name: bondley-bootstrap
    restart: "no"
    command: ["python", "-m", "app.bootstrap"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      bist-source-init:
        condition: service_completed_successfully
    volumes:
      - bist_source_data:/data/bist-source-files
    networks: [backend, egress]
    logging: *json-logging

  api:
    <<: *api-image
    container_name: bondley-api
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - bist_source_data:/data/bist-source-files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [frontend, backend]
    logging: *json-logging

  celery-worker:
    <<: *api-image
    container_name: bondley-celery-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    environment: *api-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - bist_source_data:/data/bist-source-files
    networks: [backend, egress]
    logging: *json-logging

  celery-beat:
    <<: *api-image
    container_name: bondley-celery-beat
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - --loglevel=info
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
    environment: *api-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    logging: *json-logging

  web:
    image: ghcr.io/mikailustuner/bondley-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    container_name: bondley-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    logging: *json-logging

  nginx:
    image: ghcr.io/mikailustuner/bondley-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: bondley-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [frontend]
    logging: *json-logging

volumes:
  postgres_data:
  bist_source_data:

networks:
  frontend:
  backend:
    internal: true
  egress:
