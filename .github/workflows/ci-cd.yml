name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/mikailustuner/fincalc-api
  WEB_IMAGE: ghcr.io/mikailustuner/fincalc-web
  NGINX_IMAGE: ghcr.io/mikailustuner/fincalc-nginx

jobs:
  # ─── 1. TEST ────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python — setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Python — install deps
        run: pip install -r apps/api/requirements.txt

      - name: Python — pytest
        run: pytest apps/api/tests/ -v --tb=short
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32chars
          JWT_REFRESH_SECRET_KEY: test-refresh-key-for-ci-only-32chars
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0

      - name: Node — setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Node — install deps
        run: npm ci --legacy-peer-deps

      - name: TypeScript — type check
        run: cd apps/web && npx tsc --noEmit

  # ─── 2. BUILD & PUSH ────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ─── 3. DEPLOY ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.GCP_DEPLOY_PATH }}

            # Pull latest compose file changes
            git pull origin main

            # Login to GHCR and pull new images
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u mikailustuner --password-stdin
            docker compose -f docker-compose.prod.yml pull

            # Rolling restart: api-2 first, then api (nginx stays up throughout)
            docker compose -f docker-compose.prod.yml up -d --no-build api-2
            sleep 15
            docker compose -f docker-compose.prod.yml up -d --no-build api
            sleep 15

            # Restart remaining services
            docker compose -f docker-compose.prod.yml up -d --no-build \
              nginx web celery-worker celery-beat

            # Health check
            sleep 10
            curl -sf http://localhost:3050/health || \
              (echo "Health check failed!" && exit 1)

            # Cleanup old images
            docker image prune -f

            echo "Deploy tamamlandı: $(date)"
