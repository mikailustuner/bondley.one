name: CI/CD Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      promote_canary:
        description: 'Promote canary to stable'
        required: false
        type: boolean
      rollback:
        description: 'Rollback canary deployment'
        required: false
        type: boolean

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Python code
        working-directory: apps/api
        run: |
          pip install ruff
          ruff check . || true

      - name: Build Docker images (test)
        run: |
          docker-compose -f docker-compose.prod.yml build --no-cache api web

  deploy-canary:
    name: Deploy Canary
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production-canary
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy canary
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          BRANCH_NAME="${{ github.ref_name }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << EOF
            set -e
            cd "\$DEPLOY_PATH"
            
            # Pull latest code
            git fetch origin
            git checkout "\$BRANCH_NAME"
            git pull origin "\$BRANCH_NAME"
            
            # Run canary deployment script
            chmod +x scripts/deploy-canary.sh scripts/health-check.sh scripts/test-smoke.sh scripts/promote-canary.sh scripts/rollback.sh
            ./scripts/deploy-canary.sh
          EOF

      - name: Health check canary
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << EOF
            set -e
            cd "\$DEPLOY_PATH"
            ./scripts/health-check.sh canary
          EOF

      - name: Smoke test canary
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << EOF
            set -e
            cd "\$DEPLOY_PATH"
            ./scripts/test-smoke.sh canary
          EOF

      - name: Wait for monitoring period
        run: |
          echo "Waiting 5 minutes for canary monitoring..."
          sleep 300

      - name: Check canary status
        id: check_status
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'REMOTE_EOF' > status.txt
            set -e
            cd "$DEPLOY_PATH"
            
            # Check if canary containers are healthy
            CANARY_HEALTHY=true
            if ! docker ps --filter "name=canary" --format "{{.Names}}" | grep -q canary; then
              CANARY_HEALTHY=false
            fi
            
            # Also check health endpoint
            if ! curl -f -s http://localhost:8001/health > /dev/null 2>&1; then
              CANARY_HEALTHY=false
            fi
            
            echo "$CANARY_HEALTHY"
          REMOTE_EOF
          
          CANARY_STATUS=$(cat status.txt)
          echo "canary_healthy=$CANARY_STATUS" >> $GITHUB_OUTPUT
          rm -f status.txt

      - name: Promote canary to stable
        if: steps.check_status.outputs.canary_healthy == 'true' || github.event.inputs.promote_canary == 'true'
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << EOF
            set -e
            cd "\$DEPLOY_PATH"
            ./scripts/promote-canary.sh
          EOF

      - name: Rollback canary
        if: steps.check_status.outputs.canary_healthy == 'false' || github.event.inputs.rollback == 'true'
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << EOF
            set -e
            cd "\$DEPLOY_PATH"
            ./scripts/rollback.sh
          EOF
        continue-on-error: true
