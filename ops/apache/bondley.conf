# Bondley host-level Apache reverse proxy.
# Docker gateway is intentionally exposed only at 127.0.0.1:3050.

<VirtualHost *:80>
    ServerName bondley.one
    ServerAlias www.bondley.one api.bondley.one dashboard.bondley.one admin.bondley.one

    Redirect permanent / https://bondley.one/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bondley.one
    ServerAlias www.bondley.one api.bondley.one dashboard.bondley.one admin.bondley.one

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bondley.one/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bondley.one/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:3050/$1 [P,L]

    ProxyPass        / http://127.0.0.1:3050/ nocanon connectiontimeout=5 timeout=300 retry=0
    ProxyPassReverse / http://127.0.0.1:3050/

    ErrorLog ${APACHE_LOG_DIR}/bondley-error.log
    CustomLog ${APACHE_LOG_DIR}/bondley-access.log combined
</VirtualHost>
</IfModule>
