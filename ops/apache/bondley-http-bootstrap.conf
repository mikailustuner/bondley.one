# Temporary HTTP-only vhost used only while obtaining the first certificate.

<VirtualHost *:80>
    ServerName bondley.one
    ServerAlias www.bondley.one api.bondley.one dashboard.bondley.one admin.bondley.one

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bondley-certbot-error.log
    CustomLog ${APACHE_LOG_DIR}/bondley-certbot-access.log combined
</VirtualHost>
