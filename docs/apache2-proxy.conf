<VirtualHost *:80>
    ServerName fincalc.yourdomain.com
    
    # Redirect HTTP to HTTPS (uncomment if you want to force SSL handled by Apache)
    # Redirect permanent / https://fincalc.yourdomain.com/

    ProxyPreserveHost On
    ProxyPass / http://localhost:3050/
    ProxyPassReverse / http://localhost:3050/

    ErrorLog ${APACHE_LOG_DIR}/fincalc_error.log
    CustomLog ${APACHE_LOG_DIR}/fincalc_access.log combined
</VirtualHost>

