# ========================================================
# Bondley Apache2 Reverse Proxy Configuration
# ========================================================
# Place this file in /etc/apache2/sites-available/bondley.conf
# Enable with: sudo a2ensite bondley && sudo systemctl restart apache2
# ========================================================

<VirtualHost *:80>
    ServerName udkdigital.design
    ServerAlias www.udkdigital.design dashboard.udkdigital.design admin.udkdigital.design api.udkdigital.design

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =udkdigital.design [OR]
    RewriteCond %{SERVER_NAME} =www.udkdigital.design [OR]
    RewriteCond %{SERVER_NAME} =dashboard.udkdigital.design [OR]
    RewriteCond %{SERVER_NAME} =admin.udkdigital.design [OR]
    RewriteCond %{SERVER_NAME} =api.udkdigital.design
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName udkdigital.design
    ServerAlias www.udkdigital.design dashboard.udkdigital.design admin.udkdigital.design api.udkdigital.design

    # --- SSL Configuration (Handled by Host Apache2) ---
    # Adjust paths if your certs are located elsewhere
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/udkdigital.design/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/udkdigital.design/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- Reverse Proxy to Bondley (Docker Port 3050) ---
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3050/
    ProxyPassReverse / http://127.0.0.1:3050/

    # --- Optimization Settings ---
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/bondley_error.log
    CustomLog ${APACHE_LOG_DIR}/bondley_access.log combined
</VirtualHost>
