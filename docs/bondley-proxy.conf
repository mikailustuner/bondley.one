# ========================================================
# Bondley Apache2 Reverse Proxy Configuration
# Domain: bondley.one
# ========================================================
# Place this file in /etc/apache2/sites-available/bondley.conf
# Enable with: sudo a2ensite bondley && sudo systemctl restart apache2
# ========================================================

<VirtualHost *:80>
    ServerName bondley.one
    ServerAlias www.bondley.one dashboard.bondley.one admin.bondley.one api.bondley.one

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =bondley.one [OR]
    RewriteCond %{SERVER_NAME} =www.bondley.one [OR]
    RewriteCond %{SERVER_NAME} =dashboard.bondley.one [OR]
    RewriteCond %{SERVER_NAME} =admin.bondley.one [OR]
    RewriteCond %{SERVER_NAME} =api.bondley.one
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName bondley.one
    ServerAlias www.bondley.one dashboard.bondley.one admin.bondley.one api.bondley.one

    # --- SSL Configuration (Managed by Certbot on Host) ---
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bondley.one/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bondley.one/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf # Uncomment after running certbot

    # --- Reverse Proxy to Bondley (Docker Port 3050) ---
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3050/
    ProxyPassReverse / http://127.0.0.1:3050/

    # --- Real IP and Forwarded Headers ---
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s

    ErrorLog ${APACHE_LOG_DIR}/bondley_error.log
    CustomLog ${APACHE_LOG_DIR}/bondley_access.log combined
</VirtualHost>
