version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fincalc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fincalc
      POSTGRES_PASSWORD: fincalc_secret
      POSTGRES_DB: fincalc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincalc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fincalc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fincalc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: fincalc
      POSTGRES_PASSWORD: fincalc_secret
      POSTGRES_DB: fincalc
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./sirket_kap_idleri.csv:/data/sirket_kap_idleri.csv:ro

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fincalc-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      POSTGRES_USER: fincalc
      POSTGRES_PASSWORD: fincalc_secret
      POSTGRES_DB: fincalc
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./sirket_kap_idleri.csv:/data/sirket_kap_idleri.csv:ro

  celery-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fincalc-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      POSTGRES_USER: fincalc
      POSTGRES_PASSWORD: fincalc_secret
      POSTGRES_DB: fincalc
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./sirket_kap_idleri.csv:/data/sirket_kap_idleri.csv:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fincalc-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
